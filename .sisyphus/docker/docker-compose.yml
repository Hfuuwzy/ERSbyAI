version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: 85boss-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: xm-job
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./xm-job.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - 85boss-network

  # 后端服务
  backend:
    build:
      context: ./springboot
      dockerfile: Dockerfile
    container_name: 85boss-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/xm-job?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      AI_BASE_URL: ${AI_BASE_URL:-https://kimi.a7m.com.cn/v1}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-kimi-k2.6}
    ports:
      - "9090:9090"
    volumes:
      - ./files:/app/files
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - 85boss-network

  # 前端服务
  frontend:
    build:
      context: ./vue
      dockerfile: Dockerfile
    container_name: 85boss-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - 85boss-network

volumes:
  mysql_data:

networks:
  85boss-network:
    driver: bridge
