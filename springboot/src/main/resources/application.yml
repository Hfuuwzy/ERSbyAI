server:
  port: 9090

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
    url: jdbc:mysql://localhost:3306/xm-job?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&serverTimezone=Asia/Shanghai

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml

fileBaseUrl: http://localhost:${server.port}

# AI 配置
# 生产环境请使用环境变量 AI_API_KEY
# 本地开发请复制 application-local.yml.example 为 application-local.yml
ai:
  base-url: https://kimi.a7m.com.cn/v1
  api-key: ${AI_API_KEY:}
  model: kimi-k2.6
